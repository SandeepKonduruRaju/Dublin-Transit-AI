[project]
name = "dublin-transit-ai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.7",
    "langgraph>=1.2.19",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
